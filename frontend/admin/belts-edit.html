<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit grades · Aikido Shinjukai</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .head-with-actions { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    .belt-btn { display: inline-block; padding: 6px 12px; border-radius: 8px; border: 1px solid #1f3a5f;
                background: #1f3a5f; color: #fff; text-decoration: none; font: inherit; cursor: pointer; }
    .belt-btn.secondary { background: #fff; color: #1f3a5f; }
    .belt-btn.danger { background: #fff; color: #b3261e; border-color: #b3261e; }
    .belt-btn:disabled { opacity: .4; cursor: default; }
    .belt-table { width: 100%; border-collapse: collapse; }
    .belt-table th, .belt-table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e6e3dc; }
    .belt-table td.actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .add-form { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .add-form input, .add-form select { padding: 8px 10px; border: 1px solid #cfcac0; border-radius: 8px; font: inherit; background: #fff; }
    .add-form #new-fee { width: 150px; }
    .ladder-note { font-size: 14px; font-weight: 400; margin-left: 6px; }
    #msg { min-height: 1.5em; margin: 12px 0; }
    #msg.error { color: #b3261e; }
    #msg.ok { color: #2e7d32; }
  </style>
</head>
<body data-role="admin" data-page="belts">
  <main class="container">
    <div class="page-head head-with-actions">
      <div>
        <h1>Edit grades</h1>
        <p class="muted">Add, rename, reorder and remove belt levels, and set the fee to grade for each one.
          Belts move up and down within their own ladder.</p>
      </div>
      <div><a class="belt-btn secondary" href="/admin/belts.html">← Back to belt levels</a></div>
    </div>

    <p id="msg"></p>
    <section class="card">
      <h2>Adult ladder <span class="muted ladder-note">13 and above</span></h2>
      <div id="list-adult">Loading...</div>
    </section>
    <section class="card">
      <h2>Junior ladder <span class="muted ladder-note">under 13</span></h2>
      <div id="list-junior">Loading...</div>
    </section>

    <section class="card">
      <h2>Add a belt level</h2>
      <form class="add-form" id="add-form">
        <input id="new-name" placeholder="Belt name, e.g. 5th dan" required>
        <select id="new-track" aria-label="Ladder">
          <option value="adult">Adult ladder</option>
          <option value="junior">Junior ladder</option>
        </select>
        <input id="new-fee" type="number" min="0" step="0.01" placeholder="Grading fee ($)" aria-label="Grading fee">
        <button class="belt-btn" type="submit">Add to the top of the ladder</button>
      </form>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const msg = document.getElementById('msg');
    const money = (value) => (value == null ? 'none' : formatMoney(value));
    const del = (url) => (api.delete || api.del).call(api, url);

    function say(text, isError) {
      msg.textContent = text || '';
      msg.className = isError ? 'error' : 'ok';
    }

    function button(label, className, onClick, disabled) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'belt-btn ' + className;
      b.textContent = label;
      b.disabled = !!disabled;
      b.onclick = onClick;
      return b;
    }

    async function run(action, successText) {
      try {
        await action();
        say(successText, false);
      } catch (err) {
        say(err.message || 'Something went wrong.', true);
      }
      load();
    }

    // Draw one ladder's table into the element with this id
    function render(boxId, belts) {
      const box = document.getElementById(boxId);
      if (belts.length === 0) { box.textContent = 'No belts on this ladder yet.'; return; }
      const table = document.createElement('table');
      table.className = 'belt-table';
      table.innerHTML = '<thead><tr><th>Belt</th><th>Grading fee</th><th>Actions</th></tr></thead>';
      const body = document.createElement('tbody');

      belts.forEach((belt, i) => {
        const tr = document.createElement('tr');
        const name = document.createElement('td');
        name.textContent = belt.name;
        const fee = document.createElement('td');
        fee.textContent = money(belt.grading_fee);
        const actions = document.createElement('td');
        actions.className = 'actions';

        actions.append(
          button('Up', 'secondary', () =>
            run(() => api.post('/belts/' + belt.id + '/move', { direction: 'up' }), 'Moved up.'), i === 0),
          button('Down', 'secondary', () =>
            run(() => api.post('/belts/' + belt.id + '/move', { direction: 'down' }), 'Moved down.'),
            i === belts.length - 1),
          button('Rename', 'secondary', () => {
            const newName = prompt('New name for this belt:', belt.name);
            if (newName === null || !newName.trim()) return;
            run(() => api.put('/belts/' + belt.id, { name: newName.trim(), sort_order: belt.sort_order }),
              'Belt renamed.');
          }),
          button('Set fee', 'secondary', () => {
            const answer = prompt('Fee to grade for ' + belt.name + ' (leave empty for no fee):',
              belt.grading_fee == null ? '' : belt.grading_fee);
            if (answer === null) return;
            const text = answer.trim().replace(/^\$/, '');
            if (text !== '' && !(Number(text) >= 0)) { say('The fee must be a number, 0 or more.', true); return; }
            run(() => api.put('/belts/' + belt.id, {
              name: belt.name, sort_order: belt.sort_order, grading_fee: text === '' ? null : Number(text),
            }), 'Grading fee updated.');
          }),
          button('Remove', 'danger', () => {
            if (!confirm('Remove "' + belt.name + '"?')) return;
            run(() => del('/belts/' + belt.id), 'Belt removed.');
          })
        );

        tr.append(name, fee, actions);
        body.append(tr);
      });

      table.append(body);
      box.replaceChildren(table);
    }

    async function load() {
      try {
        const belts = await api.get('/belts');
        render('list-adult', belts.filter((b) => b.track === 'adult'));
        render('list-junior', belts.filter((b) => b.track === 'junior'));
      } catch (err) {
        showError('#list-adult', err);
        document.getElementById('list-junior').textContent = '';
      }
    }

    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('new-name');
      const name = input.value.trim();
      if (!name) return;
      const fee = document.getElementById('new-fee');
      run(async () => {
        await api.post('/belts', {
          name,
          track: document.getElementById('new-track').value,
          grading_fee: fee.value === '' ? null : Number(fee.value),
        });
        input.value = '';
        fee.value = '';
      }, 'Belt added.');
    });

    load();
  </script>
</body>
</html>
