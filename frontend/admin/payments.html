<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payments · Aikido Shinjukai</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-role="admin" data-page="payments">
  <main class="container">
    <div class="page-head">
      <h1>Payments</h1>
      <p class="muted">Every payment received, newest first.</p>
    </div>

    <section class="card" id="list">Loading...</section>

    <div class="todo">
      <strong>To build here:</strong> payment tracking: filter by centre, student or date, and see who still owes.
      API: <code>paymentRoutes.js</code>, <code>paymentController.js</code> and <code>paymentModel.js</code> in <code>backend/</code>.
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    (async () => {
      try {
        const payments = await api.get('/payments');
        renderTable('#list', [
          { label: 'Date', render: (p) => esc(formatDate(p.paid_at)) },
          { label: 'Student', key: 'student' },
          { label: 'Fee', key: 'fee' },
          { label: 'Amount', render: (p) => esc(formatMoney(p.amount)) },
          { label: 'Method', key: 'method' },
          { label: 'Reference', key: 'reference' },
        ], payments);
      } catch (err) {
        showError('#list', err);
      }
    })();
  </script>
</body>
</html>
