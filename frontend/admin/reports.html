<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports · Aikido Shinjukai</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .rp-filters { display:flex; gap:12px; flex-wrap:wrap; align-items:end; margin:16px 0; }
    .rp-filters label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
    .rp-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:16px; }
    .rp-cards .k { font-size:13px; color:var(--muted); }
    .rp-cards .v { font-size:26px; font-weight:700; margin-top:4px; }
    .rp-cards .s { font-size:12px; color:var(--muted); }
    .rp-tabs { display:flex; gap:6px; flex-wrap:wrap; background:var(--pill); padding:5px; border-radius:12px; width:fit-content; margin-bottom:14px; }
    .rp-tabs button { border:0; background:transparent; padding:9px 18px; border-radius:8px; font-size:14px; cursor:pointer; color:var(--text); }
    .rp-tabs button.on { background:var(--navy); color:#fff; }
    .rp-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
    .rp-note { font-size:13px; color:var(--muted); margin-top:10px; }
  </style>
</head>
<body data-role="admin" data-page="reports">
  <main class="container">
    <div class="page-head">
      <div>
        <h1>Reports</h1>
        <p class="muted">Payments, grades, revenue and what is still owed.</p>
      </div>
    </div>

    <div class="rp-filters">
      <div><label for="from">From</label><input id="from" type="date"></div>
      <div><label for="to">To</label><input id="to" type="date"></div>
      <div><label for="centre">Branch</label>
        <select id="centre"><option value="">All branches</option></select></div>
      <button class="btn" id="apply" type="button">Apply</button>
    </div>

    <div class="rp-cards" id="cards"></div>

    <div class="rp-tabs" id="tabs">
      <button type="button" data-tab="payments" class="on">Payment history</button>
      <button type="button" data-tab="grades">Student grades</button>
      <button type="button" data-tab="revenue">Revenue</button>
      <button type="button" data-tab="outstanding">Outstanding and overdue</button>
    </div>

    <section class="card">
      <div class="rp-bar">
        <strong id="tab-title"></strong>
        <button class="btn small outline" id="export" type="button">Export CSV</button>
      </div>
      <div id="table">Loading...</div>
      <p class="rp-note" id="note"></p>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/reports.js"></script>
</body>
</html>
