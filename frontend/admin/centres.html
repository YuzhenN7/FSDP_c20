<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centres · Aikido Shinjukai</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-role="admin" data-page="centres">
  <main class="container wide">
    <div class="page-head">
      <h1>Centres</h1>
    </div>

    <div class="toolbar">
      <label>Search
        <input id="search" placeholder="Name or address">
      </label>
      <label>Region
        <select id="region"></select>
      </label>
      <label>Condition
        <select id="condition"></select>
      </label>
      <button class="btn push-right" id="edit" type="button">Edit</button>
    </div>

    <section class="card scroll-x" id="list">Loading...</section>

    <p class="note">
      Centre names and addresses come from the database. Region and condition are not stored yet,
      so what you set here resets when the page reloads.
    </p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/centres.js"></script>
</body>
</html>
