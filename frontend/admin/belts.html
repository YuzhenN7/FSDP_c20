<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belts · Aikido Shinjukai</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .head-with-actions { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    .head-actions { display: flex; gap: 8px; }
    .belt-btn { display: inline-block; padding: 8px 16px; border-radius: 8px; border: 1px solid #1f3a5f;
                background: #1f3a5f; color: #fff; text-decoration: none; font: inherit; cursor: pointer; }
    .belt-btn.secondary { background: #fff; color: #1f3a5f; }
    .ladder-note { font-size: 14px; font-weight: 400; margin-left: 6px; }
  </style>
</head>
<body data-role="admin" data-page="belts">
  <main class="container">
    <div class="page-head head-with-actions">
      <div>
        <h1>Belt levels</h1>
        <p class="muted">Two ladders, lowest first. Everyone starts on Mukyu (no rank, white belt).
          The grading fee is what a student pays to grade for that belt.</p>
      </div>
      <div class="head-actions">
        <!-- later: a "View dashboard" button goes here, to the left of Edit grades -->
        <a class="belt-btn" href="/admin/belts-edit.html">Edit grades</a>
      </div>
    </div>

    <section class="card">
      <h2>Adult ladder <span class="muted ladder-note">13 and above</span></h2>
      <div id="list-adult">Loading...</div>
    </section>
    <section class="card">
      <h2>Junior ladder <span class="muted ladder-note">under 13</span></h2>
      <div id="list-junior">Loading...</div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    (async () => {
      try {
        const belts = await api.get('/belts');
        const columns = [
          { label: 'Belt', key: 'name' },
          { label: 'Grading fee', render: (b) => (b.grading_fee == null ? '<span class="muted">none</span>' : esc(formatMoney(b.grading_fee))) },
        ];
        renderTable('#list-adult', columns, belts.filter((b) => b.track === 'adult'));
        renderTable('#list-junior', columns, belts.filter((b) => b.track === 'junior'));
      } catch (err) {
        showError('#list-adult', err);
        document.getElementById('list-junior').textContent = '';
      }
    })();
  </script>
</body>
</html>
