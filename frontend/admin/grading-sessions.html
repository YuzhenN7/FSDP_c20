<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grading sessions · Aikido Shinjukai</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-role="admin" data-page="grading-sessions">
  <main class="container">
    <div class="page-head">
      <h1>Grading sessions</h1>
      <p class="muted">Create and schedule mass or private gradings so students know when to apply.</p>
    </div>

    <p id="msg"></p>

    <section class="card">
      <h2>Create session</h2>
      <form id="session-form">
        <div class="form-grid">
          <div>
            <label for="type">Type</label>
            <select id="type" required>
              <option value="mass_adult">Mass (Adult)</option>
              <option value="mass_children">Mass (Children)</option>
              <option value="private">Private</option>
            </select>
          </div>
          <div>
            <label for="centre">Dojo</label>
            <select id="centre" required><option value="">Loading...</option></select>
          </div>
          <div>
            <label for="venue">Venue</label>
            <input id="venue" required placeholder="e.g. Level 3 Basketball Court">
          </div>
          <div>
            <label for="date">Date</label>
            <input id="date" type="date" required>
          </div>
          <div>
            <label for="time">Time</label>
            <input id="time" type="time" required>
          </div>
          <div>
            <label for="fee">Fee ($)</label>
            <input id="fee" type="number" min="0" step="0.01" required placeholder="e.g. 60">
          </div>
          <div>
            <label for="capacity">Capacity</label>
            <input id="capacity" type="number" min="1" step="1" required placeholder="e.g. 30">
            <div class="hint" id="capacity-hint">Required for mass gradings.</div>
          </div>
          <div>
            <label for="apply-open">Applications open</label>
            <input id="apply-open" type="datetime-local" required>
          </div>
          <div>
            <label for="apply-close">Applications close</label>
            <input id="apply-close" type="datetime-local" required>
          </div>
        </div>
        <button class="btn" type="submit" id="submit-btn" style="margin-top:20px">Create session</button>
      </form>
    </section>

    <section class="card">
      <h2>Scheduled sessions</h2>
      <div id="list" class="scroll">Loading...</div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/grading.js"></script>
  <script>
    const form = document.getElementById('session-form');
    const typeSelect = document.getElementById('type');
    const capacity = document.getElementById('capacity');
    const hint = document.getElementById('capacity-hint');
    const submitBtn = document.getElementById('submit-btn');

    function val(id) {
      return document.getElementById(id).value;
    }
